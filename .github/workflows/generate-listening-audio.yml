name: Generate IELTS Listening Audio

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Generate MP3 files and upload them to Backblaze B2"
        required: true
        default: true
        type: boolean

jobs:
  generate-audio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check project files
        run: |
          echo "Repository:"
          pwd
          echo ""
          echo "Root files:"
          ls -la
          echo ""
          echo "Scripts:"
          ls -la scripts || true
          echo ""
          echo "Package file:"
          ls -la package.json || true

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package.json found."
            exit 1
          fi

      - name: Generate and upload IELTS Listening audio
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_LISTENING_VOICE: eve
          XAI_TTS_MODEL: grok-tts

          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_REGION: eu-central-003
          B2_S3_ENDPOINT: https://s3.eu-central-003.backblazeb2.com

          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

          UPLOAD_TO_B2: ${{ inputs.upload }}

        run: |
          if [ ! -f scripts/generate-xai-listening-audio.js ]; then
            echo "ERROR: scripts/generate-xai-listening-audio.js was not found."
            echo "Current scripts directory:"
            ls -la scripts || true
            exit 1
          fi

          node scripts/generate-xai-listening-audio.js
