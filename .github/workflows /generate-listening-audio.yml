name: Generate IELTS Listening Audio

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Generate MP3 files and upload them to Backblaze B2"
        required: true
        default: true
        type: boolean

jobs:
  generate-audio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate and upload IELTS Listening audio
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_LISTENING_VOICE: eve
          XAI_TTS_MODEL: grok-tts
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_REGION: eu-central-003
          B2_S3_ENDPOINT: https://s3.eu-central-003.backblazeb2.com
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          UPLOAD_TO_B2: ${{ inputs.upload }}
        run: node scripts/generate-xai-listening-audio.js