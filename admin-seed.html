<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IELTS Admin — Seed Question Bank</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:520px;margin:0 auto;padding:24px;line-height:1.5}
    input,button{width:100%;box-sizing:border-box;padding:13px;margin-top:10px;border-radius:8px;border:1px solid #bbb;font-size:16px}
    button{cursor:pointer;font-weight:700}
    #result{white-space:pre-wrap;margin-top:18px;padding:12px;border-radius:8px;background:#f4f4f4}
  </style>
</head>
<body>
  <h1>Seed IELTS Question Bank</h1>
  <p>This page is for the project owner. Enter the <strong>SEED_SECRET</strong> configured in Vercel.</p>
  <input id="secret" type="password" autocomplete="off" placeholder="SEED_SECRET">
  <button id="seed">Seed Firestore</button>
  <div id="result">Ready.</div>
  <script>
    const button = document.getElementById('seed');
    const result = document.getElementById('result');
    button.addEventListener('click', async () => {
      const secret = document.getElementById('secret').value;
      if (!secret) return result.textContent = 'Enter your seed secret.';
      button.disabled = true;
      result.textContent = 'Seeding… Please wait.';
      try {
        const response = await fetch('/api/admin-seed', {
          method: 'POST',
          headers: {'Content-Type':'application/json','x-seed-secret':secret},
          body: JSON.stringify({})
        });
        const data = await response.json();
        result.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        result.textContent = 'Request failed: ' + error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
