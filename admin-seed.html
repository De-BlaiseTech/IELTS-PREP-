<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IELTS Production Seeder</title><style>body{font-family:system-ui;max-width:520px;margin:40px auto;padding:20px;background:#f5f7fa;color:#102a43}.card{background:#fff;padding:24px;border-radius:16px;border:1px solid #dce3ea}input,button{width:100%;padding:12px;margin-top:10px;border-radius:9px;border:1px solid #ccd6df}button{background:#102a43;color:#fff;border:0;font-weight:700}pre{white-space:pre-wrap;background:#eef3f7;padding:12px;border-radius:8px}</style></head><body><div class="card"><h1>Production Content Seeder</h1><p>This page writes the bundled production IELTS bank to Firestore. Keep it private and remove it after seeding.</p><input id="secret" type="password" placeholder="SEED_SECRET"><button id="go">Seed production bank</button><pre id="out"></pre></div><script>document.getElementById("go").onclick=async()=>{const out=document.getElementById("out");out.textContent="Seeding…";try{const secret=document.getElementById("secret").value.trim();const r=await fetch("/api/admin-seed",{method:"POST",headers:{"x-seed-secret":secret}});const d=await r.json();if(!r.ok)throw new Error(d.message||"Seed failed");out.textContent=JSON.stringify(d,null,2)}catch(e){out.textContent=e.message}}</script></body></html>
