<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><title>Verify Email — IELTS Prep CBT</title><link rel="stylesheet" href="style.css"></head><body><main class="auth"><section class="auth-card"><div class="auth-brand"><div class="logo">I</div><h1 id="title">Verifying your email…</h1><p id="message">Please wait while we confirm your verification link.</p></div><div id="actions"></div></section></main><script type="module">import { verifyEmail } from './auth-api.js'; const title=document.getElementById('title'),message=document.getElementById('message'),actions=document.getElementById('actions'); const token=new URLSearchParams(location.search).get('token'); async function run(){ if(!token){title.textContent='Invalid verification link';message.textContent='The verification token is missing or invalid.';return;} try{await verifyEmail(token);title.textContent='Email verified';message.textContent='Your IELTS Prep CBT account is now active. You can sign in.';actions.innerHTML='<a class="btn primary" style="display:block;text-align:center;text-decoration:none;margin-top:18px" href="/">Go to IELTS Prep</a>';}catch(e){title.textContent='Verification failed';message.textContent=e.message||'This verification link is invalid or has expired.';actions.innerHTML='<a class="btn secondary" style="display:block;text-align:center;text-decoration:none;margin-top:18px" href="/">Return to sign in</a>';}} run();</script></body></html>
