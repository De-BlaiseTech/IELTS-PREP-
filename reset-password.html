<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><title>Reset Password — IELTS Prep CBT</title><link rel="stylesheet" href="style.css"></head><body><main class="auth"><section class="auth-card"><div class="auth-brand"><div class="logo">I</div><h1>Choose a new password</h1><p>Enter a new password for your IELTS Prep CBT account.</p></div><div class="form"><label>New password<input id="password" type="password" minlength="8" placeholder="At least 8 characters"></label><div id="err"></div><button class="btn primary" id="submit">Reset password</button></div><p class="center muted"><a href="/">Return to sign in</a></p></section></main><script type="module">import { resetPassword } from './auth-api.js'; const token=new URLSearchParams(location.search).get('token'); const password=document.getElementById('password'),err=document.getElementById('err'),button=document.getElementById('submit'); button.onclick=async()=>{const p=password.value;if(!token){err.innerHTML='<div class="error">This reset link is invalid.</div>';return;}if(p.length<8){err.innerHTML='<div class="error">Password must be at least 8 characters.</div>';return;}button.disabled=true;button.textContent='Resetting…';try{await resetPassword(token,p);err.innerHTML='<div class="success">Password reset successfully. <a href="/">Sign in now</a>.</div>';}catch(e){err.innerHTML='<div class="error">'+(e.message||'Unable to reset your password.')+'</div>';button.disabled=false;button.textContent='Reset password';}};</script></body></html>
